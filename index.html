<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="IconLove.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- AOS - Animate On Scroll -->
    <link
      href="https://unpkg.com/aos@2.3.4/dist/aos.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>LoveOrNot By LANG</title>
  </head>
  <body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar navbar-expand-lg fixed-top glass-nav" id="mainNav">
      <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold" href="#">
          <!-- <i class="bi bi-heart-fill text-danger me-1"></i> -->
           <img src="IconLove.png" alt="Love Icon" class="brand-icon me-1" / style="height: 1rem;">
          <span class="brand-text">Love Question</span>
        </a>

        <div class="d-flex align-items-center gap-2">
          <!-- Restart Button -->
          <button
            class="btn btn-icon glass-btn"
            id="restartBtn"
            title="Restart"
            aria-label="Restart"
          >
            <i class="bi bi-arrow-repeat fs-5"></i>
          </button>

          <!-- Dark / Light Mode Toggle -->
          <button
            class="btn btn-icon glass-btn"
            id="themeToggle"
            title="Toggle Dark/Light Mode"
            aria-label="Toggle theme"
          >
            <i class="bi bi-moon-stars-fill fs-5 theme-icon"></i>
          </button>

          <!-- Mobile Toggle -->
          <button
            class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
            aria-controls="navbarContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <i class="bi bi-list fs-4"></i>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#" id="navQuestion">
                <i class="bi bi-chat-heart me-1"></i> Question
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="navResult">
                <i class="bi bi-emoji-heart-eyes me-1"></i> Result
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ========== QUESTION SECTION ========== -->
    <section class="question-section" id="questionSection">
      <div class="question-container" data-aos="zoom-in" data-aos-duration="1000">
        <div class="video-wrapper" data-aos="fade-up" data-aos-delay="200">
          <img src="DoYouLoveMe.gif" alt="">
        </div>
        <h2 class="question" data-aos="fade-up" data-aos-delay="400">
          Do you love me?
        </h2>
        <div class="button-container" data-aos="fade-up" data-aos-delay="600">
          <button class="yes-btn btn js-yes-btn">
            <i class="bi bi-heart-fill me-1"></i> Yes
          </button>
          <button class="no-btn btn js-no-btn">
            <i class="bi bi-x-lg me-1"></i> No
          </button>
        </div>
      </div>
    </section>

    <!-- ========== RESULT SECTION ========== -->
    <section class="result-section" id="resultSection">
      <div class="result-container" data-aos="zoom-in" data-aos-duration="800">
        <img src="AnswerLove.gif" alt="Love">
        <h2 data-aos="fade-up" data-aos-delay="300" class="result-text mt-3">
          💐 I knew it 😍
        </h2>
        <button class="btn play-again-btn" id="playAgainBtn" data-aos="fade-up" data-aos-delay="600">
          <i class="bi bi-arrow-counterclockwise me-1"></i> Play Again
        </button>
      </div>
    </section>

    <!-- =========== FOOTER ========== -->
    <footer class="bg-none text-center py-3">
      <p>&copy; 2026 LoveOrNot by Koemlang-Va. All rights reserved.</p>
    </footer>

    <!-- ========== HEART LOADER ========== -->
    <div class="cssload-main" id="heartLoader">
      <div class="cssload-heart">
        <span class="cssload-heartL"></span>
        <span class="cssload-heartR"></span>
        <span class="cssload-square"></span>
      </div>
      <div class="cssload-shadow"></div>
      <p class="loader-text">Loading love...</p>
    </div>

    <!-- ========== FLOATING HEARTS BACKGROUND ========== -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- ========== ALL JS INLINE ========== -->
    <script>
      // ===========================
      // AOS Initialization
      // ===========================
      AOS.init({
        once: true,
        offset: 80,
        easing: "ease-out-cubic",
      });

      // ===========================
      // DOM References
      // ===========================
      const questionSection = document.getElementById("questionSection");
      const resultSection = document.getElementById("resultSection");
      const questionContainer = document.querySelector(".question-container");
      const resultContainer = document.querySelector(".result-container");
      const gifResult = document.querySelector(".gif-result");
      const heartLoader = document.getElementById("heartLoader");
      const yesBtn = document.querySelector(".js-yes-btn");
      const noBtn = document.querySelector(".js-no-btn");
      const themeToggle = document.getElementById("themeToggle");
      const restartBtn = document.getElementById("restartBtn");
      const playAgainBtn = document.getElementById("playAgainBtn");
      const navQuestion = document.getElementById("navQuestion");
      const navResult = document.getElementById("navResult");
      const floatingHearts = document.getElementById("floatingHearts");
      const themeIcon = document.querySelector(".theme-icon");

      // ===========================
      // Dark / Light Mode Toggle
      // ===========================
      let isDark = localStorage.getItem("theme") === "dark";

      function applyTheme() {
        document.documentElement.setAttribute(
          "data-bs-theme",
          isDark ? "dark" : "light"
        );
        document.body.classList.toggle("dark-mode", isDark);
        themeIcon.className = isDark
          ? "bi bi-sun-fill fs-5 theme-icon"
          : "bi bi-moon-stars-fill fs-5 theme-icon";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }

      // Apply saved theme on load
      applyTheme();

      themeToggle.addEventListener("click", () => {
        isDark = !isDark;
        applyTheme();
      });

      // ===========================
      // No Button - Run Away Effect
      // ===========================
      noBtn.addEventListener("mouseover", () => {
        const maxX = questionContainer.offsetWidth - noBtn.offsetWidth - 20;
        const maxY = questionContainer.offsetHeight - noBtn.offsetHeight - 20;
        const newX = Math.floor(Math.random() * Math.max(maxX, 1));
        const newY = Math.floor(Math.random() * Math.max(maxY, 1));

        noBtn.style.left = `${newX}px`;
        noBtn.style.top = `${newY}px`;
      });

      // Also handle touch for mobile
      noBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const maxX = questionContainer.offsetWidth - noBtn.offsetWidth - 20;
        const maxY = questionContainer.offsetHeight - noBtn.offsetHeight - 20;
        const newX = Math.floor(Math.random() * Math.max(maxX, 1));
        const newY = Math.floor(Math.random() * Math.max(maxY, 1));

        noBtn.style.left = `${newX}px`;
        noBtn.style.top = `${newY}px`;
      });

      // ===========================
      // Yes Button Functionality
      // ===========================
      yesBtn.addEventListener("click", () => {
        questionSection.style.display = "none";
        heartLoader.style.display = "flex";

        // Refresh AOS for result section
        AOS.refresh();

        setTimeout(() => {
          heartLoader.style.display = "none";
          resultSection.style.display = "flex";
          gifResult.play();
          AOS.refresh();
          createFloatingHearts();
        }, 3000);
      });

      // ===========================
      // Restart / Play Again
      // ===========================
      function resetGame() {
        resultSection.style.display = "none";
        heartLoader.style.display = "none";
        questionSection.style.display = "flex";

        // Reset no button position
        noBtn.style.left = "";
        noBtn.style.top = "";

        // Clear floating hearts
        floatingHearts.innerHTML = "";

        // Reset result video
        gifResult.pause();
        gifResult.currentTime = 0;

        // Refresh AOS
        AOS.refreshHard();
      }

      restartBtn.addEventListener("click", resetGame);
      playAgainBtn.addEventListener("click", resetGame);

      // Nav links
      navQuestion.addEventListener("click", (e) => {
        e.preventDefault();
        resetGame();
      });
      navResult.addEventListener("click", (e) => {
        e.preventDefault();
        questionSection.style.display = "none";
        heartLoader.style.display = "none";
        resultSection.style.display = "flex";
        gifResult.play();
        AOS.refresh();
        createFloatingHearts();
      });

      // ===========================
      // Floating Hearts Effect
      // ===========================
      function createFloatingHearts() {
        floatingHearts.innerHTML = "";
        const heartSymbols = ["&#10084;", "&#10085;", "&#10083;", "&#129505;"];

        for (let i = 0; i < 25; i++) {
          const heart = document.createElement("div");
          heart.classList.add("floating-heart");
          heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
          heart.style.left = Math.random() * 100 + "%";
          heart.style.animationDelay = Math.random() * 5 + "s";
          heart.style.animationDuration = 3 + Math.random() * 4 + "s";
          heart.style.fontSize = 1 + Math.random() * 1.5 + "rem";
          heart.style.opacity = 0.3 + Math.random() * 0.7;
          floatingHearts.appendChild(heart);
        }
      }

      // ===========================
      // Navbar scroll effect
      // ===========================
      const mainNav = document.getElementById("mainNav");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 30) {
          mainNav.classList.add("nav-scrolled");
        } else {
          mainNav.classList.remove("nav-scrolled");
        }
      });
    </script>
  </body>
</html>
